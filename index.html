<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F5BC4">
<title>Thời tiết · Hà Nội</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:#fff; min-height:100vh; overflow-x:hidden;
    background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    background-attachment:fixed;
    transition:background 1.2s ease;
  }
  /* ====== Themes ====== */
  body[data-theme="clear-day"]   { --bg1:#0E56C8; --bg2:#3E8FE0; --bg3:#7EC3F2; --glow1:rgba(255,214,110,.55); --glow2:rgba(120,200,255,.5); }
  body[data-theme="clear-night"] { --bg1:#070D24; --bg2:#15224A; --bg3:#2B3B69; --glow1:rgba(120,150,255,.28); --glow2:rgba(60,90,190,.3); }
  body[data-theme="part-day"]    { --bg1:#1A5FBE; --bg2:#4E92D6; --bg3:#8CBDE6; --glow1:rgba(255,214,110,.45); --glow2:rgba(140,190,240,.5); }
  body[data-theme="part-night"]  { --bg1:#0A1128; --bg2:#1B2A50; --bg3:#33436F; --glow1:rgba(130,150,230,.25); --glow2:rgba(70,100,190,.3); }
  body[data-theme="cloudy-day"]  { --bg1:#4A6785; --bg2:#7793AF; --bg3:#A8BFD3; --glow1:rgba(230,235,245,.35); --glow2:rgba(160,185,215,.45); }
  body[data-theme="cloudy-night"]{ --bg1:#151D2C; --bg2:#28354A; --bg3:#404F68; --glow1:rgba(150,165,200,.2); --glow2:rgba(90,110,160,.28); }
  body[data-theme="rain-day"]    { --bg1:#3A4C66; --bg2:#5A708F; --bg3:#7E93AF; --glow1:rgba(180,205,240,.3); --glow2:rgba(110,140,185,.4); }
  body[data-theme="rain-night"]  { --bg1:#131C2E; --bg2:#243350; --bg3:#37496B; --glow1:rgba(140,165,220,.22); --glow2:rgba(80,105,165,.3); }
  body[data-theme="storm"]       { --bg1:#231D3B; --bg2:#3A3260; --bg3:#544A80; --glow1:rgba(190,170,255,.3); --glow2:rgba(120,100,200,.35); }
  body[data-theme="snow-day"]    { --bg1:#637F99; --bg2:#8FA9C0; --bg3:#BDD1E0; --glow1:rgba(255,255,255,.45); --glow2:rgba(190,215,240,.5); }
  body[data-theme="snow-night"]  { --bg1:#1A2434; --bg2:#2E3D52; --bg3:#4A5B74; --glow1:rgba(200,215,240,.22); --glow2:rgba(120,140,180,.3); }
  body[data-theme="fog"]         { --bg1:#5C6875; --bg2:#818D9C; --bg3:#A9B3BF; --glow1:rgba(235,238,243,.35); --glow2:rgba(180,188,198,.45); }

  /* ====== Sky decoration ====== */
  .sky { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .glow { position:absolute; border-radius:50%; filter:blur(90px); opacity:.6; }
  .glow-1 { width:540px; height:540px; background:var(--glow1); top:-190px; right:-140px; }
  .glow-2 { width:460px; height:460px; background:var(--glow2); bottom:-180px; left:-150px; }
  .stars { display:none; position:absolute; inset:0; }
  body[data-theme="clear-night"] .stars,
  body[data-theme="part-night"] .stars,
  body[data-theme="cloudy-night"] .stars,
  body[data-theme="rain-night"] .stars,
  body[data-theme="snow-night"] .stars { display:block; }
  .star { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff;
          animation:twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.15; transform:scale(.7)} 50%{opacity:.95; transform:scale(1.15)} }
  .cloud-bg { position:absolute; border-radius:50%; background:rgba(255,255,255,.07);
              filter:blur(50px); animation:driftX 90s linear infinite alternate; }
  .cloud-bg.b { top:34%; width:420px; height:120px; left:-10%; animation-duration:120s; }
  .cloud-bg.a { top:12%; width:520px; height:150px; right:-15%; animation-duration:140s; animation-direction:alternate-reverse; }
  @keyframes driftX { from{transform:translateX(-60px)} to{transform:translateX(80px)} }

  /* ====== Layout ====== */
  .wrap { position:relative; z-index:1; max-width:780px; margin:0 auto; padding:26px 20px 40px; }
  .hidden { display:none !important; }

  /* Topbar */
  .topbar { display:flex; justify-content:space-between; align-items:flex-start; animation:fadeUp .7s ease both; }
  .topbar h1 { font-size:30px; font-weight:700; letter-spacing:.3px; text-shadow:0 2px 14px rgba(0,0,0,.25); }
  .topbar .sub { font-size:14px; font-weight:400; opacity:.75; margin-top:2px; }
  .clockbox { text-align:right; }
  .clock { font-size:34px; font-weight:300; line-height:1; font-variant-numeric:tabular-nums; }
  .dateline { font-size:13px; opacity:.75; margin-top:5px; }

  /* Hero */
  .hero { text-align:center; padding:26px 0 10px; }
  .hero-icon { width:158px; height:158px; margin:0 auto; animation:fadeUp .8s .08s ease both; }
  .hero-temp { font-size:104px; font-weight:200; line-height:1.02; letter-spacing:-3px;
               text-shadow:0 4px 30px rgba(0,0,0,.22); animation:fadeUp .8s .16s ease both; }
  .hero-temp .deg { font-weight:300; vertical-align:top; font-size:60px; letter-spacing:0; }
  .hero-desc { font-size:22px; font-weight:500; margin-top:2px; animation:fadeUp .8s .24s ease both; }
  .hero-meta { font-size:15px; opacity:.85; margin-top:10px; animation:fadeUp .8s .3s ease both; }
  .hero-meta b { font-weight:600; }
  .up { color:#FFD9A0; } .down { color:#BFE3FF; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }

  /* Cards */
  .card {
    background:rgba(255,255,255,.09); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.16); border-radius:24px;
    padding:18px 20px; margin-top:16px; box-shadow:0 10px 34px rgba(0,0,0,.16);
    transition:transform .25s ease, background .25s ease; animation:fadeUp .7s ease both;
  }
  .card:hover { background:rgba(255,255,255,.12); }
  .card h2 { font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:1.4px;
             opacity:.62; margin-bottom:14px; display:flex; align-items:center; gap:7px; }
  .card h2 svg { width:15px; height:15px; }

  /* Hourly */
  .hourly { display:flex; gap:4px; overflow-x:auto; padding-bottom:6px; margin:0 -6px; padding-inline:6px;
            scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.25) transparent; }
  .hourly::-webkit-scrollbar { height:6px; }
  .hourly::-webkit-scrollbar-thumb { background:rgba(255,255,255,.22); border-radius:3px; }
  .hour { flex:0 0 62px; text-align:center; padding:10px 4px 12px; border-radius:16px; transition:background .2s; }
  .hour:hover { background:rgba(255,255,255,.1); }
  .hour.now { background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 1px rgba(255,255,255,.22); }
  .h-label { font-size:12px; opacity:.75; height:16px; }
  .h-icon { width:34px; height:34px; margin:7px auto 5px; }
  .h-temp { font-size:16.5px; font-weight:600; }
  .h-pop { font-size:11px; opacity:.8; color:#BFE3FF; height:14px; margin-top:3px; }

  /* Details grid */
  .details { display:grid; grid-template-columns:repeat(4,1fr); gap:13px; }
  .dcard { background:rgba(255,255,255,.09); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
           border:1px solid rgba(255,255,255,.16); border-radius:20px; padding:15px 15px 14px;
           animation:fadeUp .7s ease both; transition:transform .25s ease, background .25s ease; }
  .dcard:hover { transform:translateY(-3px); background:rgba(255,255,255,.13); }
  .dcard .d-title { font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:1px;
                    opacity:.62; display:flex; align-items:center; gap:6px; }
  .dcard .d-title svg { width:15px; height:15px; }
  .dcard .d-val { font-size:26px; font-weight:300; margin-top:9px; line-height:1.1; }
  .dcard .d-val small { font-size:13px; font-weight:400; opacity:.7; margin-left:2px; }
  .dcard .d-extra { font-size:12.5px; opacity:.8; margin-top:6px; min-height:16px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:600; color:#0d1b2e; }
  .d-wind-arrow { display:inline-block; transition:transform .8s cubic-bezier(.2,.8,.2,1); vertical-align:-2px; }
  .uv-track { position:relative; height:5px; border-radius:3px; margin-top:10px;
              background:linear-gradient(90deg,#4ADE80,#FACC15 #FACC15 45%,#FB923C 60%,#F87171 80%,#C084FC); }
  .uv-dot { position:absolute; top:50%; width:12px; height:12px; border-radius:50%; background:#fff;
            border:2.5px solid rgba(20,30,50,.75); transform:translate(-50%,-50%); transition:left .8s ease; }

  /* Sun card */
  .sun-card svg.arc { width:100%; height:auto; display:block; }
  .sun-times { display:flex; justify-content:space-between; margin-top:6px; font-size:14px; }
  .sun-times b { font-weight:600; font-variant-numeric:tabular-nums; }
  .sun-times span { display:block; font-size:11.5px; opacity:.62; margin-top:2px; }
  .sun-length { text-align:center; font-size:13px; opacity:.8; margin-top:10px; }

  /* Week */
  .wrow { display:grid; grid-template-columns:62px 32px 44px 1fr 42px 42px; align-items:center;
          gap:8px; padding:9px 4px; border-radius:14px; }
  .wrow:hover { background:rgba(255,255,255,.07); }
  .wrow + .wrow { border-top:1px solid rgba(255,255,255,.07); }
  .w-name { font-size:14px; font-weight:500; }
  .w-icon { width:28px; height:28px; }
  .w-pop { font-size:11.5px; color:#BFE3FF; text-align:right; opacity:.9; }
  .w-bar { position:relative; height:6px; border-radius:3px; background:rgba(255,255,255,.16); }
  .w-bar span { position:absolute; top:0; height:6px; border-radius:3px;
                background:linear-gradient(90deg,#7EC8F5,#FFD26E); transition:left .6s ease, width .6s ease; }
  .w-min { font-size:14px; opacity:.65; text-align:right; }
  .w-max { font-size:14px; font-weight:600; text-align:right; }

  /* Footer */
  footer { text-align:center; font-size:12.5px; opacity:.65; margin-top:26px; line-height:1.9; }
  .refresh-btn { margin-top:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
                 color:#fff; font-family:inherit; font-size:13px; font-weight:500; padding:8px 20px;
                 border-radius:99px; cursor:pointer; transition:background .2s, transform .2s; }
  .refresh-btn:hover { background:rgba(255,255,255,.2); transform:translateY(-1px); }
  .refresh-btn:active { transform:scale(.97); }
  .refresh-btn.spin svg { animation:spin 1s linear infinite; }
  .live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#4ADE80;
              margin-right:5px; animation:pulse 2s ease-in-out infinite; vertical-align:1px; }
  @keyframes pulse { 0%,100%{opacity:.5; box-shadow:0 0 0 0 rgba(74,222,128,.5)} 50%{opacity:1; box-shadow:0 0 0 5px rgba(74,222,128,0)} }

  /* Loading & error screens */
  .screen { min-height:100vh; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:20px; position:relative; z-index:1; text-align:center; padding:20px; }
  .screen .big-ic { width:110px; height:110px; }
  .screen p { font-size:16px; opacity:.85; }

  /* ====== Weather icon animations ====== */
  .wi { width:100%; height:100%; display:block; overflow:visible; }
  .wi .rays { stroke:#FFD75E; stroke-width:3.6; stroke-linecap:round;
              animation:spin 26s linear infinite; transform-box:fill-box; transform-origin:center; }
  .wi .sun-core { fill:#FFD75E; animation:sunPulse 4.5s ease-in-out infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes sunPulse { 0%,100%{filter:drop-shadow(0 0 5px rgba(255,215,94,.55))} 50%{filter:drop-shadow(0 0 13px rgba(255,215,94,.85))} }
  .wi .cloud-main { animation:bob 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .wi .cloud-back { animation:bob 7.5s ease-in-out infinite reverse; transform-box:fill-box; transform-origin:center; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2.4px)} }
  .wi .drop { stroke-linecap:round; animation:fall 1.15s ease-in infinite; opacity:0; }
  .wi .drop.d1 { animation-delay:0s; } .wi .drop.d2 { animation-delay:.38s; } .wi .drop.d3 { animation-delay:.76s; }
  @keyframes fall { 0%{transform:translateY(0); opacity:0} 18%{opacity:1} 82%{opacity:1} 100%{transform:translateY(15px); opacity:0} }
  .wi .bolt { animation:flash 2.6s infinite; }
  @keyframes flash { 0%,55%,63%,100%{opacity:.28} 58%,66%{opacity:1} 60%{opacity:.5} }
  .wi .flake { animation:snowfall 2.6s linear infinite; opacity:0; }
  .wi .flake.f2 { animation-delay:.85s; } .wi .flake.f3 { animation-delay:1.7s; }
  @keyframes snowfall { 0%{transform:translate(0,0); opacity:0} 15%{opacity:1} 50%{transform:translate(3px,9px)} 85%{opacity:.9} 100%{transform:translate(-1px,18px); opacity:0} }
  .wi .fogline { animation:fogSlide 4.5s ease-in-out infinite alternate; }
  .wi .fogline.l2 { animation-duration:5.6s; animation-delay:.4s; }
  .wi .fogline.l3 { animation-duration:6.5s; animation-delay:.9s; }
  @keyframes fogSlide { from{transform:translateX(-4.5px)} to{transform:translateX(4.5px)} }
  .wi .tw { animation:twinkle 3.2s ease-in-out infinite; }
  .wi .moon-body { fill:#F6E7AE; filter:drop-shadow(0 0 8px rgba(246,231,174,.5)); }

  @media (max-width:640px) {
    .details { grid-template-columns:repeat(2,1fr); }
    .hero-temp { font-size:86px; }
    .topbar h1 { font-size:25px; } .clock { font-size:28px; }
    .hero-icon { width:130px; height:130px; }
    .wrow { grid-template-columns:52px 30px 1fr 38px 38px; }
    .w-pop { display:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01s !important; animation-iteration-count:1 !important; transition:none !important; }
  }
</style>
</head>
<body data-theme="clear-day">

<div class="sky">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="cloud-bg a"></div>
  <div class="cloud-bg b"></div>
  <div class="stars" id="stars"></div>
</div>

<!-- Loading -->
<div class="screen" id="loading">
  <div class="big-ic" id="loadingIcon"></div>
  <p>Đang lấy dữ liệu thời tiết…</p>
</div>

<!-- Error -->
<div class="screen hidden" id="error">
  <div class="big-ic" id="errorIcon"></div>
  <p id="errorMsg">Không tải được dữ liệu thời tiết.</p>
  <button class="refresh-btn" onclick="load()">Thử lại</button>
</div>

<!-- Content -->
<div class="wrap hidden" id="content">
  <header class="topbar">
    <div>
      <h1>Hà Nội</h1>
      <div class="sub">Việt Nam</div>
    </div>
    <div class="clockbox">
      <div class="clock" id="clock">--:--</div>
      <div class="dateline" id="dateline">—</div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-icon" id="heroIcon"></div>
    <div class="hero-temp"><span id="tempNow">--</span><span class="deg">°</span></div>
    <div class="hero-desc" id="descNow">—</div>
    <div class="hero-meta" id="heroMeta"></div>
  </section>

  <section class="card" style="animation-delay:.35s">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Dự báo 24 giờ</h2>
    <div class="hourly" id="hourly"></div>
  </section>

  <section class="details" id="details" style="margin-top:16px"></section>

  <section class="card" style="animation-delay:.5s">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="4.5"/><path d="M12 3v2.5M4.9 6.5l1.8 1.8M19.1 6.5l-1.8 1.8M2.5 13H5M19 13h2.5M5 20l1.6-1.6M19 20l-1.6-1.6M12 17.5V21"/></svg>Mặt trời</h2>
    <svg class="arc" viewBox="0 0 320 138" id="sunArc">
      <path d="M24 118 Q160 -26 296 118" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3.5" stroke-linecap="round"/>
      <path id="arcDone" d="M24 118 Q160 -26 296 118" fill="none" stroke="#FFD75E" stroke-width="3.5" stroke-linecap="round" pathLength="1"/>
      <line x1="10" y1="118" x2="310" y2="118" stroke="rgba(255,255,255,.28)" stroke-width="1.6" stroke-dasharray="1 7" stroke-linecap="round"/>
      <circle id="sunDot" r="8" fill="#FFD75E" style="filter:drop-shadow(0 0 8px rgba(255,215,94,.9))"/>
    </svg>
    <div class="sun-times">
      <div>🌅 <b id="sunriseT">—</b><span>Bình minh</span></div>
      <div class="sun-length" id="dayLen" style="margin-top:0"></div>
      <div style="text-align:right">🌇 <b id="sunsetT">—</b><span>Hoàng hôn</span></div>
    </div>
  </section>

  <section class="card" style="animation-delay:.58s">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3l4 2 4-2"/></svg>7 ngày tới</h2>
    <div id="week"></div>
  </section>

  <footer>
    <span class="live-dot"></span>Dữ liệu: Open-Meteo · Cập nhật lúc <span id="updated">—</span><br>
    <button class="refresh-btn" id="refreshBtn">
      <svg style="width:14px;height:14px;vertical-align:-2px;margin-right:4px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>Làm mới
    </button>
  </footer>
</div>

<script>
/* ================= Config ================= */
const LAT = 21.0278, LON = 105.8342;
const FORECAST_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
  `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m` +
  `&hourly=temperature_2m,weather_code,precipitation_probability,is_day` +
  `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max` +
  `&timezone=auto&forecast_days=7`;
const AIR_URL = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=european_aqi,pm2_5&timezone=auto`;

/* ================= WMO weather codes ================= */
const WMO = {
  0:['Trời quang','clear'], 1:['Chủ yếu nắng','clear'], 2:['Ít mây','part'], 3:['Nhiều mây','cloudy'],
  45:['Sương mù','fog'], 48:['Sương mù lạnh','fog'],
  51:['Mưa phùn nhẹ','drizzle'], 53:['Mưa phùn','drizzle'], 55:['Mưa phùn dày','drizzle'],
  56:['Mưa phùn lạnh','drizzle'], 57:['Mưa phùn lạnh','drizzle'],
  61:['Mưa nhẹ','rain'], 63:['Mưa vừa','rain'], 65:['Mưa to','rain'],
  66:['Mưa lạnh','rain'], 67:['Mưa lạnh to','rain'],
  71:['Tuyết rơi nhẹ','snow'], 73:['Tuyết rơi','snow'], 75:['Tuyết rơi dày','snow'], 77:['Tuyết hạt','snow'],
  80:['Mưa rào nhẹ','rain'], 81:['Mưa rào','rain'], 82:['Mưa rào rất to','rain'],
  85:['Mưa tuyết','snow'], 86:['Mưa tuyết to','snow'],
  95:['Dông','storm'], 96:['Dông kèm mưa đá','storm'], 99:['Dông kèm mưa đá nặng','storm']
};
const wmo = c => WMO[c] || ['Nhiều mây','cloudy'];

/* ================= Animated SVG icons ================= */
let _uid = 0;
const rays = (cx, cy, r1, r2) => {
  let s = '';
  for (let i = 0; i < 8; i++) {
    const a = Math.PI / 4 * i;
    s += `<line x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy+r1*Math.sin(a)).toFixed(1)}" x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy+r2*Math.sin(a)).toFixed(1)}"/>`;
  }
  return s;
};
const cloudG = (x, y, s, fill, cls = 'cloud-main', op = 1) =>
  `<g class="${cls}" fill="${fill}" opacity="${op}" transform="translate(${x} ${y}) scale(${s})">
     <circle cx="-9" cy="2" r="10"/><circle cx="3" cy="-2" r="13"/><circle cx="12" cy="3" r="8.5"/>
     <rect x="-19" y="2" width="38" height="11" rx="5.5"/>
   </g>`;

function iconSvg(type) {
  const id = 'mm' + (_uid++);
  switch (type) {
    case 'sun':
      return `<svg class="wi" viewBox="0 0 64 64"><g class="rays">${rays(32,32,14.5,20)}</g><circle class="sun-core" cx="32" cy="32" r="11.5"/></svg>`;
    case 'moon':
      return `<svg class="wi" viewBox="0 0 64 64">
        <defs><mask id="${id}"><rect width="64" height="64" fill="#fff"/><circle cx="42" cy="21" r="15.5" fill="#000"/></mask></defs>
        <circle class="moon-body" cx="33" cy="33" r="17.5" mask="url(#${id})"/>
        <circle class="tw" cx="50" cy="47" r="2.4" fill="#F6E7AE"/>
        <circle class="tw" cx="15" cy="14" r="1.8" fill="#F6E7AE" style="animation-delay:1.2s"/>
        <circle class="tw" cx="53" cy="12" r="1.6" fill="#F6E7AE" style="animation-delay:2s"/></svg>`;
    case 'part-day':
      return `<svg class="wi" viewBox="0 0 64 64">
        <g class="rays" style="transform-box:view-box">${rays(24,24,11,15.5)}</g>
        <circle class="sun-core" cx="24" cy="24" r="9"/>
        ${cloudG(35, 40, 1.02, '#F4F8FF')}</svg>`;
    case 'part-night':
      return `<svg class="wi" viewBox="0 0 64 64">
        <defs><mask id="${id}"><rect width="64" height="64" fill="#fff"/><circle cx="28" cy="17" r="9.5" fill="#000"/></mask></defs>
        <circle class="moon-body" cx="24" cy="23" r="11" mask="url(#${id})"/>
        <circle class="tw" cx="16" cy="12" r="1.6" fill="#F6E7AE"/>
        ${cloudG(35, 40, 1.02, '#F4F8FF')}</svg>`;
    case 'cloudy':
      return `<svg class="wi" viewBox="0 0 64 64">
        ${cloudG(20, 26, .82, '#C7D6EC', 'cloud-back', .75)}
        ${cloudG(31, 36, 1.08, '#F4F8FF')}</svg>`;
    case 'fog':
      return `<svg class="wi" viewBox="0 0 64 64">
        ${cloudG(32, 26, 1, '#E2E9F4')}
        <g stroke="#E7EDF6" stroke-width="4" stroke-linecap="round" opacity=".9">
          <line class="fogline" x1="17" y1="45" x2="45" y2="45"/>
          <line class="fogline l2" x1="21" y1="52" x2="49" y2="52"/>
          <line class="fogline l3" x1="16" y1="59" x2="42" y2="59"/>
        </g></svg>`;
    case 'drizzle':
    case 'rain':
    case 'storm': {
      const cloudFill = type === 'storm' ? '#AEBDD6' : '#EDF3FC';
      const dropLen = type === 'drizzle' ? 6 : 9;
      const dropCol = type === 'storm' ? '#8FB4E8' : '#8FC1F5';
      let extra = '';
      if (type === 'storm')
        extra = `<polygon class="bolt" points="36,42 26,54 32.5,54 28,63 41,50 33.5,50 39,42" fill="#FFD75E"/>`;
      else
        extra = `<g stroke="${dropCol}" stroke-width="3.4">
          <line class="drop d1" x1="24" y1="45" x2="24" y2="${45+dropLen}"/>
          <line class="drop d2" x1="33" y1="45" x2="33" y2="${45+dropLen}"/>
          <line class="drop d3" x1="42" y1="45" x2="42" y2="${45+dropLen}"/></g>`;
      return `<svg class="wi" viewBox="0 0 64 64">${cloudG(32, 33, 1.08, cloudFill)}${extra}</svg>`;
    }
    case 'snow':
      return `<svg class="wi" viewBox="0 0 64 64">${cloudG(32, 33, 1.08, '#EDF3FC')}
        <g fill="#EAF4FF">
          <circle class="flake f1" cx="24" cy="46" r="2.6"/>
          <circle class="flake f2" cx="33" cy="46" r="2.2"/>
          <circle class="flake f3" cx="42" cy="46" r="2.6"/></g></svg>`;
  }
  return iconSvg('cloudy');
}

const kindIcon = (kind, isDay) => {
  switch (kind) {
    case 'clear': return isDay ? 'sun' : 'moon';
    case 'part':  return isDay ? 'part-day' : 'part-night';
    case 'cloudy': return 'cloudy';
    case 'fog': return 'fog';
    case 'drizzle': return 'drizzle';
    case 'rain': return 'rain';
    case 'storm': return 'storm';
    case 'snow': return 'snow';
    default: return 'cloudy';
  }
};
const themeFor = (kind, isDay) => {
  if (kind === 'storm' || kind === 'fog') return kind;
  if (kind === 'snow') return isDay ? 'snow-day' : 'snow-night';
  if (kind === 'rain' || kind === 'drizzle') return isDay ? 'rain-day' : 'rain-night';
  if (kind === 'cloudy') return isDay ? 'cloudy-day' : 'cloudy-night';
  if (kind === 'part') return isDay ? 'part-day' : 'part-night';
  return isDay ? 'clear-day' : 'clear-night';
};

/* ================= Small UI icons ================= */
const ui = {
  thermo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4a2 2 0 0 1 4 0v9.3a4 4 0 1 1-4 0z"/><circle cx="12" cy="17" r="1.6" fill="currentColor" stroke="none"/></svg>',
  drop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5s6.5 7 6.5 11.5a6.5 6.5 0 1 1-13 0C5.5 10.5 12 3.5 12 3.5z"/></svg>',
  wind: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8a2.5 2.5 0 1 1-2.5 2.5"/></svg>',
  gauge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4-5"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 18h9.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 5.6 11 3.5 3.5 0 0 0 7 18z"/></svg>',
  sunuv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
  leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20C4 11 10 5 20 4c0 10-5.5 16-15 16"/><path d="M4 20c3-6 7-10 12-12"/></svg>',
  rainic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h9.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 5.6 8 3.5 3.5 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>'
};

/* ================= Helpers ================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const hm = iso => iso.slice(11, 16);
const toMin = iso => (+iso.slice(11, 13)) * 60 + (+iso.slice(14, 16));
const DIRS = ['Bắc', 'Đông Bắc', 'Đông', 'Đông Nam', 'Nam', 'Tây Nam', 'Tây', 'Tây Bắc'];
const dirName = deg => DIRS[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const uvLevel = v => v < 3 ? ['Thấp', '#4ADE80'] : v < 6 ? ['Trung bình', '#FACC15'] : v < 8 ? ['Cao', '#FB923C'] : v < 11 ? ['Rất cao', '#F87171'] : ['Cực đại', '#C084FC'];
const aqiLevel = v => v <= 20 ? ['Tốt', '#4ADE80'] : v <= 40 ? ['Khá', '#A3E635'] : v <= 60 ? ['Trung bình', '#FACC15'] : v <= 80 ? ['Kém', '#FB923C'] : v <= 100 ? ['Rất kém', '#F87171'] : ['Nguy hại', '#C084FC'];
const arrowSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 11l6-6 6 6"/></svg>';

/* ================= Stars ================= */
(function makeStars() {
  const box = $('stars');
  let html = '';
  for (let i = 0; i < 55; i++) {
    const s = (Math.random() * 2 + 1).toFixed(1);
    html += `<span class="star" style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*72).toFixed(1)}%;width:${s}px;height:${s}px;animation-delay:${(Math.random()*4).toFixed(1)}s"></span>`;
  }
  box.innerHTML = html;
})();

/* ================= Clock ================= */
function tickClock() {
  const n = new Date();
  $('clock').textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  $('dateline').textContent = new Intl.DateTimeFormat('vi-VN', { weekday: 'long', day: 'numeric', month: 'numeric' }).format(n)
    .replace(/^\w/, c => c.toUpperCase());
}
setInterval(tickClock, 1000);

/* ================= Detail cards ================= */
function detailCard(iconPath, title, valHtml, extraHtml = '', delay = 0) {
  return `<div class="dcard" style="animation-delay:${delay}s">
    <div class="d-title">${iconPath}${title}</div>
    <div class="d-val">${valHtml}</div>
    <div class="d-extra">${extraHtml}</div></div>`;
}

/* ================= Render ================= */
let lastData = null, lastAir = null;

function render(w, air) {
  const cur = w.current;
  const [label, kind] = wmo(cur.weather_code);
  const isDay = cur.is_day === 1;

  document.body.dataset.theme = themeFor(kind, isDay);
  document.title = `Hà Nội ${Math.round(cur.temperature_2m)}° · ${label}`;

  // Hero
  $('heroIcon').innerHTML = iconSvg(kindIcon(kind, isDay));
  $('tempNow').textContent = Math.round(cur.temperature_2m);
  $('descNow').textContent = label;
  $('heroMeta').innerHTML =
    `<span class="up">↑</span> <b>${Math.round(w.daily.temperature_2m_max[0])}°</b>&nbsp;&nbsp;` +
    `<span class="down">↓</span> <b>${Math.round(w.daily.temperature_2m_min[0])}°</b>&nbsp;&nbsp;·&nbsp;&nbsp;` +
    `Cảm giác như <b>${Math.round(cur.apparent_temperature)}°</b>`;

  // Hourly: start from current hour, 24 items
  const hourKey = cur.time.slice(0, 13);
  let idx = w.hourly.time.findIndex(t => t.slice(0, 13) === hourKey);
  if (idx < 0) idx = 0;
  let hHtml = '';
  for (let i = idx; i < Math.min(idx + 24, w.hourly.time.length); i++) {
    const [, k] = wmo(w.hourly.weather_code[i]);
    const ic = iconSvg(kindIcon(k, w.hourly.is_day[i] === 1));
    const pop = w.hourly.precipitation_probability?.[i] ?? 0;
    const lbl = i === idx ? 'Bây giờ' : `${w.hourly.time[i].slice(11, 13)}h`;
    hHtml += `<div class="hour${i === idx ? ' now' : ''}">
      <div class="h-label">${lbl}</div>
      <div class="h-icon">${ic}</div>
      <div class="h-temp">${Math.round(w.hourly.temperature_2m[i])}°</div>
      <div class="h-pop">${pop >= 15 ? '💧' + pop + '%' : ''}</div></div>`;
  }
  $('hourly').innerHTML = hHtml;

  // Details
  const uv = w.daily.uv_index_max[0] ?? 0;
  const [uvTxt, uvCol] = uvLevel(uv);
  const aqiV = air?.current?.european_aqi;
  const [aqiTxt, aqiCol] = aqiV != null ? aqiLevel(aqiV) : ['—', '#9AA7B8'];
  const pm25 = air?.current?.pm2_5;

  $('details').innerHTML =
    detailCard(ui.sunuv, 'Chỉ số UV',
      `${uv.toFixed ? uv.toFixed(1) : uv}`,
      `<div class="uv-track"><div class="uv-dot" style="left:${Math.min(uv / 11 * 100, 100)}%;background:${uvCol}"></div></div>
       <span style="color:${uvCol};font-weight:600">${uvTxt}</span> hôm nay`, 0) +
    detailCard(ui.wind, 'Gió',
      `${Math.round(cur.wind_speed_10m)}<small>km/h</small>`,
      `<span class="d-wind-arrow" style="transform:rotate(${(cur.wind_direction_10m + 180) % 360}deg)">${arrowSvg}</span> hướng ${dirName(cur.wind_direction_10m)}`, .05) +
    detailCard(ui.drop, 'Độ ẩm', `${cur.relative_humidity_2m}<small>%</small>`,
      cur.relative_humidity_2m >= 70 ? 'Khá ẩm' : 'Thoải mái', .1) +
    detailCard(ui.leaf, 'Không khí (EAQI)',
      aqiV != null ? Math.round(aqiV) : '—',
      aqiV != null ? `<span class="badge" style="background:${aqiCol}">${aqiTxt}</span> PM2.5: ${pm25 != null ? Math.round(pm25) : '—'}µg/m³` : 'Không có dữ liệu', .15) +
    detailCard(ui.gauge, 'Áp suất', `${Math.round(cur.surface_pressure)}<small>hPa</small>`, 'Mực nước biển', .2) +
    detailCard(ui.cloud, 'Mây che phủ', `${cur.cloud_cover}<small>%</small>`,
      cur.cloud_cover < 25 ? 'Trời quang đãng' : cur.cloud_cover < 70 ? 'Mây rải rác' : 'U ám', .25) +
    detailCard(ui.thermo, 'Cảm giác như', `${Math.round(cur.apparent_temperature)}<small>°C</small>`,
      cur.apparent_temperature > cur.temperature_2m + 1 ? 'Nóng hơn nhiệt độ thực' : 'Gần nhiệt độ thực', .3) +
    detailCard(ui.rainic, 'Lượng mưa', `${(cur.precipitation).toFixed(1)}<small>mm</small>`,
      `Xác suất mưa hôm nay: ${w.daily.precipitation_probability_max?.[0] ?? 0}%`, .35);

  // Sun arc
  const sr = w.daily.sunrise[0], ss = w.daily.sunset[0];
  $('sunriseT').textContent = hm(sr);
  $('sunsetT').textContent = hm(ss);
  const nowM = toMin(cur.time), riseM = toMin(sr), setM = toMin(ss);
  let t = (nowM - riseM) / Math.max(setM - riseM, 1);
  const clamped = Math.max(0, Math.min(1, t));
  $('arcDone').setAttribute('stroke-dasharray', clamped);
  $('arcDone').setAttribute('stroke-dashoffset', 0);
  const x = (1 - clamped) ** 2 * 24 + 2 * (1 - clamped) * clamped * 160 + clamped ** 2 * 296;
  const y = (1 - clamped) ** 2 * 118 + 2 * (1 - clamped) * clamped * (-26) + clamped ** 2 * 118;
  const dot = $('sunDot');
  dot.setAttribute('cx', x.toFixed(1)); dot.setAttribute('cy', y.toFixed(1));
  dot.style.opacity = (t < 0 || t > 1) ? .35 : 1;
  const dlen = setM - riseM;
  $('dayLen').innerHTML = `Độ dài ban ngày<br><b>${Math.floor(dlen / 60)} giờ ${dlen % 60} phút</b>`;

  // Week
  const mins = w.daily.temperature_2m_min, maxs = w.daily.temperature_2m_max;
  const gMin = Math.min(...mins), gMax = Math.max(...maxs), gRange = Math.max(gMax - gMin, 1);
  const dayName = i => i === 0 ? 'Hôm nay' : i === 1 ? 'Mai' :
    new Intl.DateTimeFormat('vi-VN', { weekday: 'short' }).format(new Date(w.daily.time[i] + 'T12:00'));
  let wkHtml = '';
  for (let i = 0; i < w.daily.time.length; i++) {
    const [, k] = wmo(w.daily.weather_code[i]);
    const pop = w.daily.precipitation_probability_max?.[i] ?? 0;
    const left = ((mins[i] - gMin) / gRange) * 100;
    const width = ((maxs[i] - mins[i]) / gRange) * 100;
    wkHtml += `<div class="wrow">
      <div class="w-name">${dayName(i)}</div>
      <div class="w-icon">${iconSvg(kindIcon(k, 1))}</div>
      <div class="w-pop">${pop >= 20 ? '💧' + pop + '%' : ''}</div>
      <div class="w-bar"><span style="left:${left}%;width:${width}%"></span></div>
      <div class="w-min">${Math.round(mins[i])}°</div>
      <div class="w-max">${Math.round(maxs[i])}°</div></div>`;
  }
  $('week').innerHTML = wkHtml;

  $('updated').textContent = `${hm(cur.time)} (giờ địa phương)`;
}

/* ================= Load ================= */
async function load() {
  const btn = $('refreshBtn');
  btn && btn.classList.add('spin');
  try {
    const [wR, aR] = await Promise.allSettled([
      fetch(FORECAST_URL).then(r => { if (!r.ok) throw 0; return r.json(); }),
      fetch(AIR_URL).then(r => { if (!r.ok) throw 0; return r.json(); })
    ]);
    if (wR.status !== 'fulfilled') throw new Error('forecast failed');
    lastData = wR.value; lastAir = aR.status === 'fulfilled' ? aR.value : null;
    render(lastData, lastAir);
    $('loading').classList.add('hidden');
    $('error').classList.add('hidden');
    $('content').classList.remove('hidden');
  } catch (e) {
    $('errorMsg').textContent = 'Không tải được dữ liệu thời tiết. Kiểm tra kết nối mạng rồi thử lại nhé.';
    $('loading').classList.add('hidden');
    $('content').classList.add('hidden');
    $('error').classList.remove('hidden');
  } finally {
    btn && btn.classList.remove('spin');
  }
}

$('refreshBtn').addEventListener('click', load);
$('loadingIcon').innerHTML = iconSvg('part-day');
$('errorIcon').innerHTML = iconSvg('rain');
tickClock();
load();
setInterval(load, 10 * 60 * 1000); // tự làm mới mỗi 10 phút
</script>
</body>
</html>
